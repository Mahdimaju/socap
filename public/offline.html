<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | LaperHemat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
    }
    button {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      background-color: #c2410c;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background-color: #9a3412; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/logo-icon.png" width="64" height="64" alt="Logo LaperHemat">
    <h1>Kamu sedang offline</h1>
    <p>Koneksi internet terputus. Sambungkan kembali Wi-Fi atau data seluler untuk menghitung kombinasi promo terbaru.</p>
    <button type="button" onclick="window.location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
